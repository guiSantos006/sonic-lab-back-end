spring.application.name=sonic-lab-back-end

# MongoDB Configuration
spring.mongodb.uri=mongodb://admin:password@localhost:27017/soniclab_db?authSource=admin
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=soniclab_db
spring.mongodb.username=admin
spring.mongodb.password=password
spring.mongodb.authentication-database=admin
spring.mongodb.representation.uuid=standard

# JWT Security Configuration
api.security.token.secret=${JWT_SECRET:soniclab-super-secret-key-for-development-and-tests-2026}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:24}
api.security.token.issuer=sonic-lab-api

# Frontend URL (para links de reset de senha e e-mails)
app.frontend.url=${FRONTEND_URL:http://localhost:3000}


# Email Configuration Mailtrap.io
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=92eb55e4cc4ca4
spring.mail.password=79b2e92f7e8e60
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=sandbox.smtp.mailtrap.io

# Ativa o log detalhado no console para depurar qualquer erro de envio
