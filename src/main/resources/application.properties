spring.application.name=sonic-lab-back-end

# ===================================================================
# Server & Web Configuration
# ===================================================================
server.port=${PORT:8080}

# Limite maximo de arquivo para uploads (ex: 200MB)
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:200MB}

# Valores padroes e maximos para paginacao
spring.data.web.pageable.default-page-size=${PAGEABLE_DEFAULT_SIZE:50}

# ===================================================================
# Database Configuration (MongoDB)
# ===================================================================
# Permite definir uma URI completa (ex: MongoDB Atlas em nuvem) ou montar com parametros individuais.
# Por padrao conecta com os valores locais definidos no docker-compose.yml.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://${MONGODB_USERNAME:admin}:${MONGODB_PASSWORD:password}@${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGODB_DATABASE:soniclab_db}?authSource=${MONGODB_AUTH_SOURCE:admin}}
spring.data.mongodb.database=${MONGODB_DATABASE:soniclab_db}
spring.data.mongodb.representation.uuid=standard

# Alias retrocompativel caso algum componente espere o prefixo spring.mongodb.*
spring.mongodb.uri=${spring.data.mongodb.uri}
spring.mongodb.database=${spring.data.mongodb.database}
spring.mongodb.representation.uuid=${spring.data.mongodb.representation.uuid}

# ===================================================================
# Security & JWT Configuration
# ===================================================================
# IMPORTANTE: Em producao, SEMPRE defina JWT_SECRET via variavel de ambiente com uma chave forte e aleatoria!
api.security.token.secret=${JWT_SECRET:soniclab-super-secret-key-for-development-and-tests-2026}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:24}
api.security.token.issuer=${JWT_ISSUER:sonic-lab-api}

# ===================================================================
# Frontend & CORS Configuration
# ===================================================================
# URL do frontend para CORS e construcao de links (ex: reset de senha)
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ===================================================================
# Email Configuration (SMTP / Mailtrap / SendGrid)
# ===================================================================
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.ssl.trust=${MAIL_SSL_TRUST:sandbox.smtp.mailtrap.io}

# Ativa o log detalhado no console para depuracao de envio de e-mails
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

# Remetente padrao exibido nos e-mails enviados pelo sistema
app.mail.from=${MAIL_FROM:SonicLab <noreply@soniclab.com>}

# ===================================================================
# File Storage Configuration
# ===================================================================

storage.local.dir=${STORAGE_LOCAL_DIR:./uploads}
storage.local.base-url=${STORAGE_LOCAL_BASE_URL:http://localhost:8080/uploads/}

storage.type=s3
storage.s3.bucket=${S3_BUCKET:meu-projeto-storage-dev-2026-512902042762-us-east-2-an}
storage.s3.region=${AWS_REGION:us-east-2}
storage.s3.url-duration-minutes=15