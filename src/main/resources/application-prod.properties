# ===================================================================
# SONIC LAB BACK-END - Production Profile (SPRING_PROFILES_ACTIVE=prod)
# ===================================================================
# Em producao, segredos e URLs criticas nao possuem fallback de desenvolvimento.

# Banco de dados (MongoDB Atlas obrigatorio)
spring.data.mongodb.uri=${MONGODB_URI:}
spring.mongodb.uri=${spring.data.mongodb.uri}

# Seguranca JWT (obrigatorio via JWT_SECRET; sem fallback de desenvolvimento)
api.security.token.secret=${JWT_SECRET:}

# Frontend / CORS (obrigatorio via FRONTEND_URL; sem fallback de localhost)
app.frontend.url=${FRONTEND_URL:}

# Armazenamento em nuvem (AWS S3 por padrao em producao)
storage.type=${STORAGE_TYPE:s3}
storage.s3.bucket=${S3_BUCKET:}
storage.s3.region=${AWS_REGION:us-east-2}
storage.s3.access-key=${AWS_ACCESS_KEY_ID:}
storage.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
storage.s3.path-style-access=${S3_PATH_STYLE_ACCESS:false}